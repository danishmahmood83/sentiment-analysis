spring.application.name=socialmedia-stock-sentiment
# Oracle DB config
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=danish
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update

# Server port
server.port=8080

# Token Configuration
twitter.bearer.token=AAAAAAAAAAAAAAAAAAAAAOI62QEAAAAAzx7qBnICZzQ2bolkyHjqu3uY5C8%3DLl6bWCmcCHSEMh4NhNd4Da93AojIvy6vnV8vFtHKgyuyXcOlq0
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
myapp.bearer.token=

# Kafka
#spring.kafka.bootstrap-servers=localhost:9092 # temp disable 
spring.kafka.bootstrap-server
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


spring.kafka.consumer.group-id=notification-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# exclude reactive DB config since we are not using r2dbc
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.r2db.R2dbcAutoConfiguration
